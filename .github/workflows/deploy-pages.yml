name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # caiwu 仓库推送后由对方仓库触发本仓库重建演练版（需在 caiwu 仓库配置
  # repository_dispatch：类型 pages-demo，目标本仓库）。
  repository_dispatch:
    types: [pages-demo]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 演练版构建固定引用的 caiwu 提交。
# 升级演练版时改这一处；固定 ref 可避免 caiwu main 上进行中的改动破坏官网发布。
env:
  CAIWU_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 演练版三端源码在后端仓库（公开）。固定 ref checkout 到 ./caiwu。
      # 拉取失败时后续 demo:build 会以「缺少 dist-demo」报错，而不是静默发布空目录。
      - uses: actions/checkout@v4
        with:
          repository: HaoSehu/caiwu
          ref: ${{ env.CAIWU_REF }}
          path: caiwu

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # caiwu 是 npm workspaces 仓库，三端 demo 构建需要其自身依赖。
      - name: Install caiwu dependencies
        working-directory: caiwu
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build frontend demos
        run: npm run demo:build -- --caiwu ./caiwu --skip-site-build

      # GitHub Pages 对未匹配路径返回 404.html；用同一份入口接管，
      # 让 /features 这类直接访问或刷新由 vue-router 渲染而不是真 404。
      # 同时写入 CNAME，保证每次部署都保留自定义域名绑定。
      # 注意：演练版三端 SPA 用 hash 路由，不依赖这份回退。
      - name: SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          echo "www.cixx.cn" > dist/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
